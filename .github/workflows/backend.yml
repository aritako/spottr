name: backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      OPENAI_API_KEY: dummy
      DATABASE_URL: postgresql+psycopg://coach:coach@localhost:5432/coach_test
      TEST_DATABASE_URL: postgresql+psycopg://coach:coach@localhost:5432/coach_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Migrate test database
        run: alembic upgrade head

      - name: Test
        run: pytest -q
